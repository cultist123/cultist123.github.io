<p><a href="https://leetcode.cn/problems/longest-happy-string/">1405. 最长快乐字符串</a><br />
用贪心,在满足不联系3个的基础上,尽量用数字最多的,注意元组不能修改,所以要先拿出来再放进去,以及堆只能找到最大但是不能找到第二大的,所以要把最大拿出来,然后才能再把第二大拿出来,还有就是判断字母是否=0,如果=0就不要放入堆,以免下面还要再检测一下是否超出范围</p>
