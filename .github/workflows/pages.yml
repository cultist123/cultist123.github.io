name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate pages
        run: python3 generate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Wait for deployment artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GH_REPO/actions/runs/$GH_RUN_ID/artifacts" > "$RUNNER_TEMP/pages-artifacts.json" &&
              python3 -c 'import json, os, sys; data=json.load(open(sys.argv[1])); sys.exit(0 if any(a["name"] == os.environ["ARTIFACT_NAME"] and not a["expired"] for a in data["artifacts"]) else 1)' "$RUNNER_TEMP/pages-artifacts.json"; then
              echo "Deployment artifact is ready."
              exit 0
            fi
            echo "Waiting for deployment artifact (attempt $attempt/12)..."
            sleep 5
          done
          echo "Deployment artifact did not become available in time."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
