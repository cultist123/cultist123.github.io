<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="PingFang SC, Hiragino Sans GB, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>
  <!-- left panel -->
  <rect x="20" y="20" width="410" height="290" rx="14" fill="#eef4fb" stroke="#9bb7d8"/>
  <text x="225" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e86">Policy Learning（策略学习）</text>
  <text x="225" y="78" text-anchor="middle" font-size="15" fill="#333">a<tspan baseline-shift="sub" font-size="11">t</tspan> = π<tspan baseline-shift="sub" font-size="11">θ</tspan>(o<tspan baseline-shift="sub" font-size="11">t</tspan>)　　Model-Free / ACT 属于此类</text>
  <rect x="45" y="120" width="105" height="64" rx="10" fill="#fff" stroke="#6a8fbf"/>
  <text x="97" y="148" text-anchor="middle" font-size="15">观察 o<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <text x="97" y="170" text-anchor="middle" font-size="12" fill="#666">图像 + 关节</text>
  <rect x="180" y="120" width="90" height="64" rx="10" fill="#1f4e86"/>
  <text x="225" y="158" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">π<tspan baseline-shift="sub" font-size="12">θ</tspan></text>
  <rect x="300" y="120" width="105" height="64" rx="10" fill="#fff" stroke="#6a8fbf"/>
  <text x="352" y="148" text-anchor="middle" font-size="15">动作 a<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <text x="352" y="170" text-anchor="middle" font-size="12" fill="#666">关节目标</text>
  <line x1="150" y1="152" x2="178" y2="152" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="270" y1="152" x2="298" y2="152" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <text x="225" y="230" text-anchor="middle" font-size="14" fill="#333">只需学会"该怎么做"</text>
  <text x="225" y="256" text-anchor="middle" font-size="13" fill="#555">例：插头偏左 → 机械臂向右调整</text>
  <text x="225" y="288" text-anchor="middle" font-size="13" fill="#2e7d32">✓ 目标直接，通常更容易学</text>
  <!-- right panel -->
  <rect x="450" y="20" width="410" height="290" rx="14" fill="#fbf1e8" stroke="#d9b08c"/>
  <text x="655" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#8a4b14">Environment Modeling（环境建模）</text>
  <text x="655" y="78" text-anchor="middle" font-size="15" fill="#333">s<tspan baseline-shift="sub" font-size="11">t+1</tspan> = f(s<tspan baseline-shift="sub" font-size="11">t</tspan>, a<tspan baseline-shift="sub" font-size="11">t</tspan>)　　Model-Based / 世界模型</text>
  <rect x="470" y="105" width="95" height="44" rx="10" fill="#fff" stroke="#c48a55"/>
  <text x="517" y="133" text-anchor="middle" font-size="15">状态 s<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <rect x="470" y="160" width="95" height="44" rx="10" fill="#fff" stroke="#c48a55"/>
  <text x="517" y="188" text-anchor="middle" font-size="15">动作 a<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <rect x="610" y="120" width="90" height="64" rx="10" fill="#8a4b14"/>
  <text x="655" y="158" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">f</text>
  <rect x="735" y="120" width="105" height="64" rx="10" fill="#fff" stroke="#c48a55"/>
  <text x="787" y="148" text-anchor="middle" font-size="15">下一状态</text>
  <text x="787" y="170" text-anchor="middle" font-size="13">s<tspan baseline-shift="sub" font-size="10">t+1</tspan></text>
  <line x1="565" y1="127" x2="608" y2="145" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="565" y1="182" x2="608" y2="162" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="700" y1="152" x2="733" y2="152" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <text x="655" y="230" text-anchor="middle" font-size="14" fill="#333">要预测"做了之后世界怎么变"</text>
  <text x="655" y="256" text-anchor="middle" font-size="13" fill="#555">摩擦、接触、碰撞、物体运动……</text>
  <text x="655" y="288" text-anchor="middle" font-size="13" fill="#b23b2b">✗ 精确建模接触动力学很难</text>
</svg>
