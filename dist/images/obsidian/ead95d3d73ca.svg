<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="PingFang SC, Hiragino Sans GB, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#222">时间集成（k = 3）：每步重预测，对同一时刻的多份预测加权平均</text>
  <!-- column headers -->
  <g font-size="14" fill="#666" text-anchor="middle">
    <text x="225" y="70">执行时刻 0</text><text x="315" y="70">1</text><text x="405" y="70">2</text><text x="495" y="70">3</text><text x="585" y="70">4</text>
  </g>
  <g font-size="14" fill="#333">
    <text x="60" y="108">t = 0 预测</text><text x="60" y="158">t = 1 预测</text><text x="60" y="208">t = 2 预测</text>
  </g>
  <!-- highlight column 2 -->
  <rect x="370" y="80" width="70" height="150" rx="10" fill="none" stroke="#222" stroke-width="2.5"/>
  <g font-size="16" text-anchor="middle" font-weight="700">
    <rect x="195" y="86" width="60" height="34" rx="6" fill="#f3c6c0"/><text x="225" y="109">a0</text>
    <rect x="285" y="86" width="60" height="34" rx="6" fill="#f3c6c0"/><text x="315" y="109">a1</text>
    <rect x="375" y="86" width="60" height="34" rx="6" fill="#f3c6c0"/><text x="405" y="109">a2</text>
    <rect x="285" y="136" width="60" height="34" rx="6" fill="#f7deb0"/><text x="315" y="159">b1</text>
    <rect x="375" y="136" width="60" height="34" rx="6" fill="#f7deb0"/><text x="405" y="159">b2</text>
    <rect x="465" y="136" width="60" height="34" rx="6" fill="#f7deb0"/><text x="495" y="159">b3</text>
    <rect x="375" y="186" width="60" height="34" rx="6" fill="#c9e3c6"/><text x="405" y="209">c2</text>
    <rect x="465" y="186" width="60" height="34" rx="6" fill="#c9e3c6"/><text x="495" y="209">c3</text>
    <rect x="555" y="186" width="60" height="34" rx="6" fill="#c9e3c6"/><text x="585" y="209">c4</text>
  </g>
  <line x1="440" y1="100" x2="641" y2="140" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="645" y="110" width="210" height="96" rx="10" fill="#eef4fb" stroke="#6a8fbf"/>
  <text x="750" y="140" text-anchor="middle" font-size="15">â₂ = w₀a₂ + w₁b₂ + w₂c₂</text>
  <text x="750" y="166" text-anchor="middle" font-size="13" fill="#444">wᵢ = exp(−m·i)，再归一化</text>
  <text x="750" y="190" text-anchor="middle" font-size="12" fill="#666">w₀ 对应最早的预测 a₂</text>
  <rect x="60" y="250" width="795" height="62" rx="10" fill="#f6f6f6" stroke="#ccc"/>
  <text x="80" y="276" font-size="13" fill="#333">· 最早预测权重最大，新观测通过后续项逐步融入；m 越小，新观测融入越快。</text>
  <text x="80" y="298" font-size="13" fill="#333">· 平均的是"不同时刻对同一执行时刻的预测"，不是把相邻时刻的动作做平滑，因此不引入额外延迟。</text>
</svg>
