<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="PingFang SC, Hiragino Sans GB, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="880" height="360" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#222">BC 的分布偏移：小误差 → 陌生状态 → 更大误差</text>
  <!-- demo coverage band -->
  <path d="M60,230 C200,215 320,160 460,150 C600,140 700,110 820,95 L820,165 C700,180 600,210 460,220 C320,230 200,285 60,300 Z" fill="#dbeedd" stroke="none"/>
  <text x="140" y="322" font-size="13" fill="#2e7d32">绿色区域：示范数据覆盖的状态分布（训练分布）</text>
  <!-- expert -->
  <path d="M60,265 C200,250 320,195 460,185 C600,175 700,145 820,130" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <text x="860" y="152" text-anchor="end" font-size="14" fill="#2e7d32">专家轨迹</text>
  <!-- learner drift -->
  <path d="M60,265 C170,252 250,232 330,200 C410,168 470,120 540,92 C600,70 650,62 700,58" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5"/>
  <g fill="#c0392b">
    <circle cx="60" cy="265" r="5"/><circle cx="200" cy="245" r="5"/><circle cx="330" cy="200" r="5"/><circle cx="450" cy="138" r="5"/><circle cx="560" cy="85" r="5"/><circle cx="700" cy="58" r="5"/>
  </g>
  <text x="860" y="82" text-anchor="end" font-size="14" fill="#c0392b">BC 策略（逐步独立预测）</text>
  <text x="365" y="210" font-size="13" fill="#555">① 一步小误差</text>
  <text x="445" y="126" text-anchor="end" font-size="13" fill="#555">② 进入少见状态</text>
  <text x="575" y="100" font-size="13" fill="#555">③ 预测更差，误差累积</text>
  <text x="60" y="290" font-size="13" fill="#333">起点</text>
  <rect x="40" y="56" width="300" height="84" rx="10" fill="#f6f6f6" stroke="#ccc"/>
  <text x="54" y="80" font-size="13" fill="#333">两类对策：</text>
  <text x="54" y="102" font-size="13" fill="#333">· DAgger：在线交互 + 专家纠正</text>
  <text x="54" y="124" font-size="13" fill="#333">· ACT：动作分块，减少决策次数</text>
</svg>
