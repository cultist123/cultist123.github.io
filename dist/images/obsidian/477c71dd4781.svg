<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="PingFang SC, Hiragino Sans GB, Helvetica, sans-serif">
  <rect width="880" height="300" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#222">动作分块：H = 100 步，k = 10（非重叠执行）</text>
  <text x="30" y="80" font-size="15" font-weight="700" fill="#b23b2b">传统 BC</text>
  <text x="30" y="100" font-size="12" fill="#666">每步调用一次策略</text>
  <defs>
    <pattern id="ticks" x="160" y="0" width="6.8" height="34" patternUnits="userSpaceOnUse"><rect width="6.8" height="34" fill="#e9a39a"/><line x1="6.8" y1="0" x2="6.8" y2="34" stroke="#fff" stroke-width="1"/></pattern>
  </defs>
  <rect x="160" y="66" width="680" height="34" fill="url(#ticks)"/>
  <text x="845" y="88" font-size="14" fill="#b23b2b" text-anchor="end" dx="30">100 次</text>
  <text x="30" y="160" font-size="15" font-weight="700" fill="#1f4e86">ACT 分块</text>
  <text x="30" y="180" font-size="12" fill="#666">每 k 步调用一次</text>
  <defs>
    <pattern id="chunks" x="160" y="0" width="68" height="34" patternUnits="userSpaceOnUse"><rect width="68" height="34" fill="#9fc1e6"/><line x1="68" y1="0" x2="68" y2="34" stroke="#1f4e86" stroke-width="3"/></pattern>
  </defs>
  <rect x="160" y="146" width="680" height="34" fill="url(#chunks)"/>
  <text x="845" y="168" font-size="14" fill="#1f4e86" text-anchor="end" dx="30">10 次</text>
  <text x="194" y="168" text-anchor="middle" font-size="12" fill="#123">a0…a9</text>
  <text x="262" y="168" text-anchor="middle" font-size="12" fill="#123">a10…a19</text>
  <text x="160" y="120" font-size="12" fill="#888">t = 0</text>
  <text x="840" y="120" font-size="12" fill="#888" text-anchor="end">t = 99</text>
  <rect x="160" y="210" width="680" height="72" rx="10" fill="#f6f6f6" stroke="#ccc"/>
  <text x="500" y="238" text-anchor="middle" font-size="16" fill="#222">H_effective ≈ H / k = 100 / 10 = 10 次高层决策</text>
  <text x="500" y="264" text-anchor="middle" font-size="13" fill="#555">论文实际 k = 100（50 Hz 下 ≈ 2 秒动作）；若每步重预测 + 时间集成，调用次数仍是 H</text>
</svg>
