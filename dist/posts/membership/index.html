<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="个人主页、项目与学习笔记"><title>成员管理与故障检测 · Nathen</title><link rel="stylesheet" href="/style.css?v=sidebar-compact-20261009"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231769aa'/%3E%3Cpath d='M9 8h14v16H9zM12 13h8M12 17h8' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"></head><body><div class="shell"><header class="header"><a class="name" href="/">Nathen</a><nav class="nav" aria-label="主导航"><a href="/">首页</a><a href="/blogs/" aria-current="page">博客</a><a href="/projects/">项目</a></nav></header><main id="main-content"><a class="back" href="/blogs/#systems">返回博客</a><p class="eyebrow">分布式系统</p><h1>成员管理与故障检测</h1><p class="lead">2026 年 10 月 3 日 · 示例文章</p><article class="panel prose"><p>从心跳到 Gossip，理解分布式系统如何判断节点是否存活。</p><h2>为什么需要成员管理</h2><p>一个节点需要知道哪些同伴可以通信。成员管理维护这一视图，并处理节点加入、离开与故障。</p><h2>故障检测的取舍</h2><p>超时并不能证明节点已经故障。网络延迟和丢包也会造成误判。调整检测周期、超时与确认方式，需要平衡检测速度和误报率。</p><h2>实验记录</h2><p>记录实验环境、节点数量、注入的故障以及测量方式，才能比较不同配置的表现。</p></article></main><footer class="footer"><span>© 2026 Nathen</span><span>学习、构建与记录。</span></footer></div></body></html>
