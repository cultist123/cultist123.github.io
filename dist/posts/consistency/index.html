<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="个人主页、项目与学习笔记"><title>一致性与可用性的取舍 · Nathen</title><link rel="stylesheet" href="/style.css?v=course-sidebar-20261004-2"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231769aa'/%3E%3Cpath d='M9 8h14v16H9zM12 13h8M12 17h8' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"></head><body><div class="shell"><header class="header"><a class="name" href="/">Nathen</a><nav class="nav" aria-label="主导航"><a href="/">首页</a><a href="/blogs/" aria-current="page">博客</a><a href="/projects/">项目</a></nav></header><main id="main-content"><a class="back" href="/blogs/#systems">返回博客</a><p class="eyebrow">分布式系统</p><h1>一致性与可用性的取舍</h1><p class="lead">2026 年 10 月 3 日 · 示例文章</p><article class="panel prose"><p>整理副本、一致性与网络分区之间的关系。</p><h2>副本与读写</h2><p>副本提高容错能力，也让不同节点可能在同一时刻看到不同数据。讨论一致性之前，需要明确读写如何传播。</p><h2>网络分区</h2><p>通信中断时，系统无法同时保证每个请求都成功响应和所有读写都符合线性一致性。设计需要针对具体业务选择行为。</p></article></main><footer class="footer"><span>© 2026 Nathen</span><span>学习、构建与记录。</span></footer></div></body></html>
